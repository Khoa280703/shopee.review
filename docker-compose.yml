x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopee_review
      # No insecure default: a weak password is how INFRA-C1/H2 of the prior
      # audits happened (app ran as a public-facing superuser with the dev
      # password). Generate with `openssl rand -hex 32`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong password in .env, e.g. openssl rand -hex 32)}
      POSTGRES_DB: shopee_review
    # idle_in_transaction_session_timeout: bound an abandoned interactive
    # transaction to a pooled connection instead of holding it forever (there
    # are only DEFAULT_POOL_SIZE=25 server slots).
    # statement_timeout: ONE global 60s value (L5), not a tighter per-path
    # override. A per-connection override via DATABASE_URL's `options=-c
    # statement_timeout=...` was tried and verified NOT to work through
    # pgbouncer in transaction-pooling mode (confirmed empirically in the
    # pre-deploy rehearsal, matches pgbouncer's own issue tracker: listing
    # `options` in ignore_startup_parameters stops pgbouncer erroring on it,
    # but the parameter is then genuinely dropped, not forwarded to the real
    # Postgres session — `SHOW statement_timeout` through pgbouncer still
    # showed the server default regardless of what the client sent). So this
    # one value has to cover every path (API queries AND migrations AND
    # pg_dump/pg_restore, all as shopee_review_app) — 60s is generous enough
    # not to abort a migration or backup at the current (seed-sized) data
    # volume; see this same comment's counterpart in docs/deployment-guide.md
    # if that data volume grows enough to need raising it.
    # pg_stat_statements: preloaded here (GUC requires a restart to take effect);
    # the extension itself is created once by postgres/init/01-app-role.sql.
    command: >-
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c statement_timeout=60000
      -c idle_in_transaction_session_timeout=30000
    # Bound to loopback only: never publish the database on a public interface.
    # Prod overrides POSTGRES_PASSWORD via gitignored .env with a fresh volume.
    ports:
      - "127.0.0.1:65432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once against a brand-new (empty) volume: creates pg_stat_statements
      # and a second, non-superuser role (shopee_review_app) that owns the
      # database — Postgres refuses to strip SUPERUSER from the bootstrap role
      # itself ("the bootstrap user must have the SUPERUSER attribute",
      # verified empirically), so that role is simply never used again after
      # this script runs. See docs/deployment-guide.md "Postgres role
      # rotation" for migrating an already-running (live) database to this.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopee_review"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Phase 1 — Redis (cache + BullMQ + Socket.io adapter) and pgBouncer pool.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # Shared by cache-manager (60s-TTL keys, self-expiring), BullMQ, Socket.io
    # adapter and SSE pub/sub. maxmemory-policy MUST be noeviction — BullMQ job
    # state can never be evicted; cache keys expire via TTL, not eviction.
    # (Was 48gb/allkeys-lru, which risked silently dropping queue jobs.)
    command: >-
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    mem_limit: 640m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Not published to host in prod; reachable on the compose network as redis:6379.

  pgbouncer:
    # Pinned by digest (`edoburu/pgbouncer` only ships a moving `:latest` tag).
    # This is the exact image already running in prod (pgbouncer 1.25.2).
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Non-superuser, database-owner role (created by postgres/init/01-app-
      # role.sh) — never the bootstrap superuser named by the db service's
      # POSTGRES_USER.
      DB_USER: shopee_review_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong password in .env, e.g. openssl rand -hex 32)}
      DB_NAME: shopee_review
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      # Server-side pool per user/db. Must be >= the app's total client
      # connection_limit so a slow query (MV refresh, retention) doesn't starve
      # concurrent API queries of a pooled connection.
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      MAX_CLIENT_CONN: "100"
      # Transaction mode + Prisma: disable server-side prepared statements.
      MAX_PREPARED_STATEMENTS: "0"
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.3
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U shopee_review || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Reachable on the compose network as pgbouncer:6432.

  # ---------------------------------------------------------------------------
  # Automated Postgres backups (daily, gzip, with retention). Dumps land in
  # ./backups on the host. Restore: gunzip -c backups/last/<file>.sql.gz | psql ...
  # ---------------------------------------------------------------------------
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    # `umask 0077` before the image's default entrypoint so every directory it
    # creates under /backups lands 700 and every dump file lands 600 (the
    # backup image itself has no umask/mode env var — PII, email + bcrypt
    # hashes, otherwise land world-readable, as the infra audit found).
    command: ["/bin/sh", "-c", "umask 0077 && exec /init.sh"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: shopee_review
      # Same non-superuser, database-owner role the app connects as — pg_dump
      # only needs ownership of what it's dumping, not SUPERUSER.
      POSTGRES_USER: shopee_review_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong password in .env, e.g. openssl rand -hex 32)}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups:/backups
    mem_limit: 256m
    cpus: 0.3
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application services (built from each app's Dockerfile). Behind Nginx.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3066"
      # Runtime traffic through pgBouncer; migrations via DIRECT_URL (Postgres).
      # connection_limit must be >1: this long-running process runs HTTP queries,
      # BullMQ workers and crons in one node — a single connection serializes them
      # all, so one slow query (MV refresh, retention delete) would block every API
      # call. Kept <= pgBouncer DEFAULT_POOL_SIZE (25) so clients never queue for a
      # server connection.
      # statement_timeout (L5) is NOT set per-connection here — see the `db`
      # service's statement_timeout comment for why (verified: PgBouncer in
      # transaction-pooling mode accepts but silently drops a `options=-c
      # statement_timeout=...` startup parameter, so it has no effect). One
      # generous 60s global value on the `db` service covers this path too.
      DATABASE_URL: postgresql://shopee_review_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong password in .env, e.g. openssl rand -hex 32)}@pgbouncer:6432/shopee_review?pgbouncer=true&connection_limit=15
      DIRECT_URL: postgresql://shopee_review_app:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set a strong password in .env, e.g. openssl rand -hex 32)}@db:5432/shopee_review
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (set a long random string in .env)}
      # Guards the Bull Board queue dashboard (job payloads carry emails/reset
      # links) — required, no insecure default, same policy as JWT_SECRET.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required (set a long random string in .env)}
      # Optional hard override. Normally leave unset: the backend auto-enables the
      # Secure cookie flag when the request arrives over HTTPS (X-Forwarded-Proto).
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-shopee.review <onboarding@resend.dev>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-}
      # Optional: platform affiliate id (scrape degrades to plain product URL if unset).
      SHOPEE_AFFILIATE_ID: ${SHOPEE_AFFILIATE_ID:-}
      # First-admin bootstrap: comma-separated usernames granted is_admin on boot.
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-shopee-review-uploads}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    expose:
      - "3066"
    # 1.5GB headroom: Node + the Playwright/Chromium scrape fallback (the
    # scraper is API-first; Chromium only launches when Shopee's API path
    # fails) on a host shared with ~10 other projects.
    mem_limit: 1536m
    cpus: 1.5
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3066/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      # No NEXT_PUBLIC_API_URL: the browser uses a relative /api base (nginx is
      # same-origin), so nothing host-specific is baked into the client bundle.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (set a long random string in .env)}
      # Internal URL for SSR → backend (never exposed to browser)
      API_INTERNAL_URL: http://backend:3066/api
    depends_on:
      - backend
    expose:
      - "3000"
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Phase 7 — Nginx single entrypoint (rate limit, WS proxy, gzip, headers).
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Loopback-only publish: in prod Traefik reaches nginx over the `coolify`
    # network (TLS terminates there), so the app is never served as plain HTTP on
    # a public interface. Local dev still hits http://localhost:8081.
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - nginx-cache:/var/cache/nginx
    # worker_connections (nginx.conf) is 4096; the container's default soft
    # nofile limit (1024) is lower, so nginx logged a startup warning and would
    # hit "too many open files" well before the configured connection ceiling.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    networks:
      - default
      - coolify
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      # Apex domain: HTTP → HTTPS redirect; HTTPS serves the app. Traefik (via
      # Coolify) terminates TLS and issues/renews the Let's Encrypt cert through
      # its own `letsencrypt` resolver — no certbot container in this stack.
      traefik.http.routers.shopeereview-http.entryPoints: "http"
      traefik.http.routers.shopeereview-http.rule: "Host(`${DOMAIN:-shopee.review}`)"
      traefik.http.routers.shopeereview-http.middlewares: "shopeereview-redirect-https"
      traefik.http.routers.shopeereview-https.entryPoints: "https"
      traefik.http.routers.shopeereview-https.rule: "Host(`${DOMAIN:-shopee.review}`)"
      traefik.http.routers.shopeereview-https.tls: "true"
      traefik.http.routers.shopeereview-https.tls.certresolver: "letsencrypt"
      traefik.http.services.shopeereview.loadbalancer.server.port: "80"
      # www → redirect to the apex domain (both HTTP and HTTPS entrypoints).
      traefik.http.routers.shopeereview-www-http.entryPoints: "http"
      traefik.http.routers.shopeereview-www-http.rule: "Host(`www.${DOMAIN:-shopee.review}`)"
      traefik.http.routers.shopeereview-www-http.middlewares: "shopeereview-www-redirect"
      traefik.http.routers.shopeereview-www-https.entryPoints: "https"
      traefik.http.routers.shopeereview-www-https.rule: "Host(`www.${DOMAIN:-shopee.review}`)"
      traefik.http.routers.shopeereview-www-https.tls: "true"
      traefik.http.routers.shopeereview-www-https.tls.certresolver: "letsencrypt"
      traefik.http.routers.shopeereview-www-https.middlewares: "shopeereview-www-redirect"
      traefik.http.middlewares.shopeereview-redirect-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.shopeereview-www-redirect.redirectregex.regex: "^https?://www\\.(.+)"
      traefik.http.middlewares.shopeereview-www-redirect.redirectregex.replacement: "https://$${1}"
      traefik.http.middlewares.shopeereview-www-redirect.redirectregex.permanent: "true"
    depends_on:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # Phase 6 — Meilisearch (primary search; PG FTS is the fallback).
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe}
      MEILI_MAX_INDEXING_MEMORY: 512Mb
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Reachable on the compose network as meilisearch:7700.

volumes:
  pgdata:
  redis-data:
  meili-data:
  nginx-cache:

networks:
  default:
  coolify:
    external: true
