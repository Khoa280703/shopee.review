server {
  listen 80;
  listen [::]:80;
  server_name _;

  # ---- Security headers ----
  # HSTS here is safe to set unconditionally: Traefik (Coolify) terminates
  # real TLS at the edge and only ever reaches this nginx over the private
  # `coolify` network — every client that sees this header reached us via
  # HTTPS. (Locations with their own add_header re-`include` this same
  # snippet — see nginx/snippets/security-headers.conf — instead of
  # repeating a partial subset that silently drops HSTS, L6.)
  include /etc/nginx/snippets/security-headers.conf;

  include /etc/nginx/snippets/app-locations.conf;
}
