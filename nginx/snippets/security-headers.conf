# Shared security headers (L6). A location block with its own `add_header`
# does NOT inherit the server-level ones declared in app.conf — nginx only
# inherits add_header into a location when that location has zero add_header
# directives of its own. Every location below that sets any add_header must
# `include` this snippet instead of repeating a partial subset, or it silently
# drops whichever header the server block had (previously HSTS was missing on
# /api/ and /_next/static/ responses).
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
