# Logs-only observability stack — run alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# All ports bind to 127.0.0.1 only — reach them via an SSH tunnel, never the
# public internet (these UIs/APIs have weak or no auth of their own). e.g.:
#   ssh -L 3001:127.0.0.1:3001 user@host   then open http://localhost:3001
# Grafana admin password is required (no insecure default). No Prometheus/
# metrics here by design — see docs/system-architecture.md "Observability".
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    # Loki has no auth and an open push API; keep it off public interfaces.
    # Promtail reaches it over the compose network (loki:3100), not this port.
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    mem_limit: 128m
    cpus: 0.3
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required (set a strong password in .env)}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - loki
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

volumes:
  loki-data:
  grafana-data:
